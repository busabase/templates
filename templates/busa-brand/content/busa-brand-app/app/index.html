<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Busa Brand</title>
    <link rel="stylesheet" href="./base-ui.css">
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
    <link rel="stylesheet" href="./accent-theme.css">
  </head>
  <body class="ws-has-mobile-bar">
    <div id="app" class="app-shell">
      <aside class="sidebar" id="appSidebar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">BN</div>
          <div class="brand-copy">
            <div class="brand-title">Busa Brand</div>
            <div id="sync-status" class="brand-subtitle">Loading</div>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" title="Toggle sidebar" aria-label="Toggle sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <section class="human-work" aria-labelledby="humanWorkTitle">
          <div class="human-work-eyebrow" data-i18n="attention">Need attention</div>
          <div id="humanWorkTitle" class="human-work-title" data-i18n="humanWorkTitle">What needs your attention</div>
          <a id="reviewLink" class="human-work-primary" href="#/narrative?status=needs_review" title="Review drafts awaiting adoption">
            <span>
              <strong id="count-review">0</strong>
              <span data-i18n="needReview">assets need review</span>
            </span>
          </a>
          <div class="human-work-secondary">
            <a href="#/drift" title="Open drift alerts">
              <strong id="count-drift">0</strong>
              <span data-i18n="driftOpen">open drift alerts</span>
            </a>
            <a href="#/narrative?status=approved" title="Canonical assets">
              <strong id="count-canonical">0</strong>
              <span data-i18n="canonical">Canonical</span>
            </a>
          </div>
        </section>
        <div class="sidebar-separator"></div>
        <nav class="filters" aria-label="Views">
          <a href="#/overview" data-route="overview"><span data-i18n="overview">Overview</span></a>
          <a href="#/narrative" data-route="narrative"><span data-i18n="narrative">Narrative</span><span id="nav-count-narrative" class="nav-count"></span></a>
          <a href="#/stories" data-route="stories"><span data-i18n="stories">Stories</span><span id="nav-count-stories" class="nav-count"></span></a>
          <a href="#/drift" data-route="drift"><span data-i18n="drift">Drift</span><span id="nav-count-drift" class="nav-count"></span></a>
        </nav>
        <div class="sidebar-footer">
          <a href="#/settings" data-route="settings" class="settings-link" data-i18n="settings">Help & Settings</a>
          <label for="language" data-i18n="language">Language</label>
          <select id="language">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
      </aside>
      <main class="main">
        <div class="mobile-topbar">
          <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="appSidebar" aria-label="Open sidebar" title="Open sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
          <div class="mobile-topbar-copy">
            <div id="mobileViewTitle" class="mobile-view-title">Busa Brand</div>
            <div id="mobileViewMeta" class="mobile-view-meta">Loading</div>
          </div>
          <button id="mobileRefresh" class="mobile-refresh-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
        </div>
        <div id="loadState" class="load-state" role="status">Loading</div>
        <!-- Overview is the only page with a hero and a metrics band. -->
        <section id="overviewPage" class="ws-overview" hidden>
          <header class="page-hero">
            <div>
              <h1 id="overviewTitle">The message house</h1>
              <p id="overviewSummary"></p>
            </div>
            <div class="page-actions">
              <button id="refresh" class="button" type="button" title="Refresh">Refresh</button>
            </div>
          </header>
          <div id="overviewMetrics" class="ws-metrics" aria-label="Narrative quality"></div>
          <div id="overviewBody"></div>
        </section>
        <!-- Record views: one toolbar row over a full-bleed table. -->
        <section id="viewPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="viewTitle"></h1>
              <span id="viewCount" class="ws-count"></span>
            </div>
            <div class="ws-actions">
              <div id="viewFilters" class="segmented" hidden></div>
              <select id="statusSelect" class="status-select" aria-label="Status" hidden></select>
              <label class="search toolbar-search">
                <span class="sr-only" data-i18n="search">Search</span>
                <input id="search" type="search" autocomplete="off" placeholder="Search">
              </label>
            </div>
          </header>
          <div id="workspace" class="ws-workspace">
            <div id="listPanel" class="ws-list"></div>
            <aside id="detailPanel" class="ws-detail" aria-live="polite">
              <div class="ws-detail-bar">
                <button id="detailBack" class="button" type="button">Back to list</button>
                <a id="detailExpand" class="button" hidden>Open full page</a>
              </div>
              <div id="detailBody"></div>
            </aside>
          </div>
        </section>
        <section id="settingsPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="settingsTitle">Help & Settings</h1></div>
          </header>
          <div id="settingsBody" class="settings-scroll"></div>
        </section>
      </main>
    </div>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./accent-theme.js"></script>
  </body>
</html>
