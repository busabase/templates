<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Busa VC Diligence</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <strong id="brandName">Busa VC Diligence</strong>
          <span id="brandSub"></span>
        </div>
        <span class="badge" id="readOnlyBadge" title="This cockpit never writes"></span>
      </header>

      <div class="state-message" id="loadingState" role="status"></div>
      <div class="state-message error" id="errorState" role="alert" hidden></div>

      <main id="overviewPage" hidden>
        <section class="metrics" id="metrics" aria-label="Desk summary"></section>
        <p class="page-note" id="pageNote" hidden></p>

        <section class="card" aria-labelledby="targetsTitle">
          <header class="card-head">
            <h2 id="targetsTitle"></h2>
          </header>
          <div id="targetsList"></div>
          <p class="empty" id="targetsEmpty" hidden></p>
        </section>

        <div class="grid">
          <section class="card" aria-labelledby="wallTitle">
            <header class="card-head">
              <h2 id="wallTitle"></h2>
              <span class="count" id="wallCount"></span>
            </header>
            <div id="wallList"></div>
            <p class="empty" id="wallEmpty" hidden></p>
          </section>

          <section class="card" aria-labelledby="stuckTitle">
            <header class="card-head">
              <h2 id="stuckTitle"></h2>
              <span class="count" id="stuckCount"></span>
            </header>
            <div id="stuckList"></div>
            <p class="empty" id="stuckEmpty" hidden></p>
          </section>
        </div>

        <section class="card" aria-labelledby="reportTitle">
          <header class="card-head">
            <h2 id="reportTitle"></h2>
            <button class="copy-button" id="copyReport" type="button"></button>
          </header>
          <pre class="report" id="reportText"></pre>
        </section>

        <div class="load-more" id="loadMoreBar" hidden></div>
        <footer class="foot" id="readOnlyNote"></footer>
      </main>

      <main id="viewPage" hidden>
        <button class="back-button" id="backButton" type="button"></button>
        <section class="card">
          <header class="card-head">
            <h2 id="detailName"></h2>
            <span class="pill" id="detailStage"></span>
          </header>
          <p class="meta" id="detailMeta"></p>
          <h3 class="subhead" id="thesisTitle"></h3>
          <p id="detailThesis"></p>
          <h3 class="subhead" id="workstreamsTitle"></h3>
          <div id="detailWorkstreams"></div>
          <h3 class="subhead" id="findingsTitle"></h3>
          <div id="detailFindings"></div>
          <h3 class="subhead" id="claimsTitle"></h3>
          <div id="detailClaims"></div>
          <h3 class="subhead" id="interviewsTitle"></h3>
          <div id="detailInterviews"></div>
          <h3 class="subhead" id="actionsTitle"></h3>
          <div id="detailActions"></div>
        </section>
      </main>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
