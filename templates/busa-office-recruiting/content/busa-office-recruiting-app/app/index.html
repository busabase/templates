<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Office management</title>
    <link rel="stylesheet" href="./base-ui.css" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./domain.css" />
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css" />
  </head>
  <body class="ws-has-mobile-bar">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">B</span>
          <div class="brand-copy">
            <strong id="brand"></strong><span id="brandSub"></span>
          </div>
          <button
            class="icon-button"
            id="closeNav"
            title="Close navigation"
            aria-label="Close navigation"
          >
            ×
          </button>
        </div>
        <a class="attention" id="attentionLink" href="#/attention">
          <span id="attentionLabel"></span><strong id="attentionCount">—</strong
          ><span id="attentionScope"></span>
        </a>
        <nav id="nav" class="base-nav"></nav>
        <div class="sidebar-footer">
          <label
            ><span class="sr-only" id="languageLabel">Language</span
            ><select id="language">
              <option value="en">English</option>
              <option value="zh-CN">简体中文</option>
            </select></label
          ><button
            class="icon-button"
            id="refresh"
            title="Refresh"
            aria-label="Refresh"
          >
            ↻
          </button>
          <button
            class="icon-button"
            id="help"
            title="Review and connection"
            aria-label="Review and connection"
          >
            ?
          </button>
        </div>
      </aside>
      <main class="main">
        <header class="mobile-bar">
          <button
            class="icon-button"
            id="openNav"
            aria-label="Open navigation"
            title="Open navigation"
          >
            ☰</button
          ><strong id="mobileTitle"></strong>
        </header>
        <div id="loading" class="state-message" role="status"></div>
        <div id="error" class="state-message error" role="alert" hidden></div>
        <!-- Overview is the only page with a hero and a metrics band. -->
        <section id="overviewPage" class="ws-overview" hidden>
          <header class="page-hero">
            <div>
              <h1 id="overviewTitle"></h1>
              <p id="overviewSummary"></p>
            </div>
          </header>
          <div id="metrics" class="ws-metrics"></div>
          <div id="overviewBody" class="overview-grid"></div>
        </section>
        <!-- Record views: one toolbar row over a full-bleed table. -->
        <section id="viewPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="viewTitle"></h1>
              <span id="viewCount" class="ws-count"></span>
            </div>
            <div class="ws-actions">
              <label
                ><span class="sr-only" id="statusLabel">Status</span
                ><select id="status" class="toolbar-select"></select></label
              ><label class="search"
                ><input
                  id="search"
                  type="search"
                  autocomplete="off"
                  aria-label="Search loaded records"
              /></label>
            </div>
          </header>
          <div id="workspace" class="ws-workspace">
            <div id="listPanel" class="ws-list"></div>
            <aside id="detailPanel" class="ws-detail" aria-live="polite">
              <div class="ws-detail-bar" id="detailBar">
                <button id="back" class="button" type="button"></button>
                <a id="expand" class="button" hidden></a>
              </div>
              <article id="detail"></article>
            </aside>
          </div>
        </section>
      </main>
    </div>
    <button
      id="scrim"
      class="sidebar-scrim"
      aria-label="Close navigation"
      hidden
    ></button>
    <dialog id="helpDialog" class="modal" aria-labelledby="helpTitle">
      <header class="modal-header">
        <h2 id="helpTitle"></h2>
        <form method="dialog">
          <button
            class="icon-button"
            id="closeHelp"
            title="Close"
            aria-label="Close"
          >
            ×
          </button>
        </form>
      </header>
      <section id="helpBody" class="help-body"></section>
    </dialog>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
