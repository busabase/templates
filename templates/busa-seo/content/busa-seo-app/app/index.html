<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Busa SEO</title>
    <link rel="stylesheet" href="./styles/base-ui.css">
    <link rel="stylesheet" href="./styles/layers.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
    <link rel="stylesheet" href="./styles/workflow.css" />
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
    <link rel="stylesheet" href="./accent-theme.css">
  </head>
  <body class="ws-has-mobile-bar">
    <div id="app" class="app-shell">
      <aside class="sidebar" id="appSidebar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">↗</div>
          <div class="brand-copy">
            <div class="brand-title">Busa SEO</div>
            <div id="sync-status" class="brand-subtitle">Loading</div>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" title="Toggle sidebar" aria-label="Toggle sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <section class="human-work" aria-labelledby="humanWorkTitle">
          <div class="human-work-eyebrow" data-i18n="attention">Need attention</div>
          <div id="humanWorkTitle" class="human-work-title" data-i18n="humanWorkTitle">What needs your attention</div>
          <a class="human-work-primary" href="#/opportunities" data-route="opportunities" title="Open the opportunities review queue">
            <span>
              <strong id="count-review">0</strong>
              <span data-i18n="needsReview">need review</span>
            </span>
          </a>
          <div class="human-work-secondary">
            <a href="#/opportunities" data-route="opportunities" title="Approved, waiting for the agent">
              <strong id="count-approved">0</strong>
              <span data-i18n="readyForAgent">ready for agent</span>
            </a>
            <a href="#/opportunities" data-route="opportunities" title="Blocked opportunities">
              <strong id="count-blocked">0</strong>
              <span data-i18n="blocked">blocked</span>
            </a>
          </div>
        </section>
        <div class="sidebar-separator"></div>
        <nav class="filters" aria-label="Main">
          <a href="#/overview" data-route="overview" data-i18n="overview">Overview</a>
          <a href="#/queries" data-route="queries" data-i18n="queries">Queries</a>
          <a href="#/pages" data-route="pages" data-i18n="pages">Pages</a>
          <a href="#/opportunities" data-route="opportunities" data-i18n="opportunities">Opportunities</a>
          <a href="#/geo" data-route="geo" data-i18n="geoNav">AI visibility</a>
          <a href="#/optimize" data-route="optimize" data-i18n="optimize">GEO optimizer</a>
          <a href="#/entity" data-route="entity" data-i18n="entity">Entity readiness</a>
          <a href="#/sites" data-route="sites" data-i18n="sites">Sites</a>
          <a href="#/settings" data-route="settings" data-i18n="settings">Help &amp; Settings</a>
        </nav>
        <div class="sidebar-footer">
          <label for="site" data-i18n="site">Site</label>
          <select id="site"></select>
          <label for="language" data-i18n="language">Language</label>
          <select id="language">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
      </aside>
      <main class="main">
        <div class="mobile-topbar">
          <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="appSidebar" aria-label="Open sidebar" title="Open sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
          <div class="mobile-topbar-copy">
            <div id="mobileViewTitle" class="mobile-view-title">Busa SEO</div>
            <div id="mobileViewMeta" class="mobile-view-meta">Loading</div>
          </div>
          <button id="mobileRefresh" class="mobile-refresh-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
        </div>
        <div id="loadState" class="load-state" role="status">Loading</div>
        <!-- Overview is the only page with a hero and a metrics band. -->
        <section id="overviewPage" class="ws-overview" hidden>
          <header class="page-hero">
            <div>
              <h1 id="overviewTitle">Overview</h1>
              <p id="overviewSummary"></p>
            </div>
            <div class="page-actions">
              <button id="refresh" class="button" type="button" title="Refresh">Refresh</button>
            </div>
          </header>
          <div id="overviewMetrics" class="ws-metrics" aria-label="Search performance summary"></div>
          <div id="overviewBody"></div>
        </section>
        <!-- Record views (queries, pages, sites, opportunities, GEO optimizer):
             one toolbar row over a full-bleed table, with a detail pane whose
             mode (page / drawer / split) is declared per Base in config.js. -->
        <section id="viewPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="viewTitle"></h1>
              <span id="viewCount" class="ws-count"></span>
            </div>
            <div class="ws-actions">
              <div id="viewFilters" class="chip-row" hidden></div>
              <label class="search toolbar-search">
                <span class="sr-only" data-i18n="search">Search</span>
                <input id="search" type="search" autocomplete="off" placeholder="Search">
              </label>
            </div>
          </header>
          <div id="workspace" class="ws-workspace">
            <div id="listPanel" class="ws-list"></div>
            <aside id="detailPanel" class="ws-detail" aria-live="polite">
              <div class="ws-detail-bar">
                <button id="detailBack" class="button" type="button">Back to list</button>
                <a id="detailExpand" class="button" hidden>Open full page</a>
              </div>
              <div id="detailBody"></div>
            </aside>
          </div>
        </section>
        <!-- AI-visibility is one engine×prompt matrix, not records browsed one at
             a time — no detail mode, just the toolbar + full-bleed dashboard. -->
        <section id="geoPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="geoTitle"></h1></div>
          </header>
          <div id="geoBody" class="content"></div>
        </section>
        <!-- Entity readiness is a short checklist; every row already shows its
             own full detail and action buttons, so there is no separate list +
             detail pane to open. -->
        <section id="entityPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="entityTitle"></h1></div>
          </header>
          <div id="entityBody" class="content"></div>
        </section>
        <section id="settingsPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="settingsTitle">Help &amp; Settings</h1></div>
          </header>
          <div id="settingsBody" class="content"></div>
        </section>
      </main>
    </div>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./accent-theme.js"></script>
  </body>
</html>
