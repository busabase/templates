<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark">
    <title>Busa PR Review</title>
    <link rel="stylesheet" href="./base-ui.css">
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
    <link rel="stylesheet" href="./accent-theme.css">
  </head>
  <body class="ws-has-mobile-bar">
    <div class="app-shell">
      <aside class="sidebar" id="appSidebar">
        <div class="sidebar-top">
          <div class="brand-icon" aria-hidden="true">PR</div>
          <div>
            <div class="brand-title">Busa PR Review</div>
            <div class="brand-subtitle" data-i18n="brand.subtitle">GitHub review desk</div>
          </div>
          <button id="sidebarToggle" class="icon-button sidebar-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" aria-label="Toggle sidebar" title="Toggle sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <nav class="filters" id="filters" aria-label="Workflow filters">
          <button data-mode="overview" class="nav-overview"><span data-i18n="nav.overview">Overview</span></button>
          <button data-mode="needs_review"><span data-i18n="filter.needs_review">Needs your review</span> <span id="count-needs_review" class="nav-count">0</span></button>
          <button data-mode="to_approve"><span data-i18n="filter.to_approve">Ready to approve</span> <span id="count-to_approve" class="nav-count">0</span></button>
          <button data-mode="approved"><span data-i18n="filter.approved">Approved</span> <span id="count-approved" class="nav-count">0</span></button>
          <button data-mode="needs_test"><span data-i18n="filter.needs_test">Needs test</span> <span id="count-needs_test" class="nav-count">0</span></button>
          <button data-mode="tested"><span data-i18n="filter.tested">Tested</span> <span id="count-tested" class="nav-count">0</span></button>
          <button data-mode="blocked"><span data-i18n="filter.blocked">Blocked</span> <span id="count-blocked" class="nav-count">0</span></button>
          <button data-mode="done"><span data-i18n="filter.done">Done</span> <span id="count-done" class="nav-count">0</span></button>
          <button data-mode="all"><span data-i18n="filter.all">All</span> <span id="count-all" class="nav-count">0</span></button>
        </nav>
        <div class="setup-card" id="setupCard">
          <div class="setup-title" data-i18n="setup.title">Setup</div>
          <div id="setupBody" class="muted" data-i18n="loading.config">Loading configuration...</div>
          <button id="helpButton" class="flat-button" data-i18n="help.title">Help & Settings</button>
        </div>
      </aside>

      <main class="main">
        <div class="mobile-topbar">
          <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="appSidebar" aria-label="Open sidebar" title="Open sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
          <div id="mobileViewTitle" class="mobile-view-title">Busa PR Review</div>
        </div>
        <div id="lockBanner" class="lock-banner" hidden>
          <strong data-i18n="locked">Locked</strong>
          <span id="lockMessage">Busabase is updating this record for a moment.</span>
        </div>
        <div id="loadState" class="load-state" role="status" data-i18n="loading">Loading…</div>

        <!-- Overview is the only page with a hero and a metrics band. -->
        <section id="overviewPage" class="ws-overview" hidden>
          <header class="page-hero">
            <div>
              <h1 data-i18n="overview.title">Overview</h1>
              <p id="batchMeta">No pull requests yet</p>
            </div>
            <div class="page-actions">
              <select id="overviewRepoFilter" class="repo-select" aria-label="Filter by repository"></select>
              <button id="refreshButton" class="button" type="button" data-i18n="refresh">Refresh</button>
            </div>
          </header>
          <div id="overviewMetrics" class="ws-metrics" aria-label="Review summary"></div>
          <div id="overviewBody" class="overview-grid"></div>
        </section>

        <!-- Record views: one toolbar row over a full-bleed table. -->
        <section id="viewPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="sectionTitle">Needs your review</h1>
              <span id="listCount" class="ws-count">0</span>
            </div>
            <div class="ws-actions">
              <input id="searchInput" class="toolbar-search" type="search" autocomplete="off" placeholder="Search title, repo, author" data-i18n-placeholder="search.placeholder" />
              <select id="repoFilter" class="repo-select" aria-label="Filter by repository"></select>
              <button id="reloadButton" class="button icon-only" type="button" title="Refresh" aria-label="Refresh">↻</button>
            </div>
          </header>
          <div id="workspace" class="ws-workspace">
            <div id="prList" class="ws-list"></div>
            <aside id="detailPanel" class="ws-detail" aria-live="polite">
              <div class="ws-detail-bar">
                <button id="detailBack" class="button" type="button" data-i18n="back_to_list">Back to list</button>
                <a id="detailExpand" class="button" hidden data-i18n="open_full_page">Open full page</a>
              </div>
              <div id="detailBody"></div>
            </aside>
          </div>
        </section>
      </main>
    </div>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>

    <div id="helpModal" class="modal-backdrop" hidden aria-hidden="true">
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
        <div class="modal-head">
          <div>
            <div id="helpTitle" class="modal-title" data-i18n="help.title">Help & Settings</div>
            <div id="helpSubtitle" class="modal-subtitle" data-i18n="help.subtitle">Busabase resources and reviewer configuration</div>
          </div>
          <button id="closeHelp" data-i18n="close">Close</button>
        </div>
        <div class="modal-body" id="helpBody"></div>
      </section>
    </div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./accent-theme.js"></script>
  </body>
</html>
