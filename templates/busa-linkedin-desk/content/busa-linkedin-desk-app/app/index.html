<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Busa LinkedIn Desk</title>
    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <strong id="brandName">Busa LinkedIn Desk</strong>
          <span id="brandSub"></span>
        </div>
        <span class="topbar-side">
          <select id="localeSelect" class="locale-select"></select>
          <span class="badge" id="readOnlyBadge" title="This console never writes"></span>
        </span>
      </header>

      <div class="state-message" id="loadingState" role="status"></div>
      <div class="state-message error" id="errorState" role="alert" hidden></div>

      <main id="overviewPage" hidden>
        <section class="metrics" id="metrics" aria-label="Desk summary"></section>
        <p class="page-note" id="pageNote" hidden></p>

        <section class="card" aria-labelledby="approvalsTitle">
          <header class="card-head">
            <h2 id="approvalsTitle"></h2>
            <span class="count" id="approvalsCount"></span>
          </header>
          <div id="approvalsList"></div>
          <p class="empty" id="approvalsEmpty" hidden></p>
        </section>

        <div class="grid">
          <section class="card" aria-labelledby="todayTitle">
            <header class="card-head">
              <h2 id="todayTitle"></h2>
            </header>
            <div class="stat-rows" id="todayStats"></div>
            <div class="chips" id="intentMix"></div>
          </section>

          <section class="card" aria-labelledby="reportTitle">
            <header class="card-head">
              <h2 id="reportTitle"></h2>
              <button class="copy-button" id="copyReport" type="button"></button>
            </header>
            <pre class="report" id="reportText"></pre>
          </section>
        </div>

        <div class="grid">
          <section class="card" aria-labelledby="dueTitle">
            <header class="card-head">
              <h2 id="dueTitle"></h2>
            </header>
            <h3 class="subhead" id="actionsSubhead"></h3>
            <div id="dueList"></div>
            <h3 class="subhead" id="stalledSubhead"></h3>
            <div id="stalledList"></div>
            <p class="empty" id="stalledEmpty" hidden></p>
          </section>

          <section class="card" aria-labelledby="expTitle">
            <header class="card-head">
              <h2 id="expTitle"></h2>
              <span class="count" id="expCount"></span>
            </header>
            <div id="expList"></div>
            <p class="empty" id="expEmpty" hidden></p>
          </section>
        </div>

        <footer class="foot" id="readOnlyNote"></footer>
      </main>
    </div>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
