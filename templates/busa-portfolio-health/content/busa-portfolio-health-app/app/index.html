<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>RBF Portfolio Health</title>
    <link rel="stylesheet" href="./styles/base-ui.css">
    <link rel="stylesheet" href="./styles/layers.css" />
    <link rel="stylesheet" href="./styles/shell.css" />
    <link rel="stylesheet" href="./styles/workflow.css" />
    <link rel="stylesheet" href="./vendor/busabase-airapp-gate.css">
    <link rel="stylesheet" href="./accent-theme.css">
  </head>
  <body>
    <div id="app" class="app-shell">
      <aside class="sidebar" id="appSidebar">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">P</div>
          <div class="brand-copy">
            <div class="brand-title">Portfolio Health</div>
            <div id="sync-status" class="brand-subtitle">Loading</div>
          </div>
          <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="appSidebar" aria-expanded="true" title="Toggle sidebar" aria-label="Toggle sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
        </div>
        <section class="human-work" aria-labelledby="humanWorkTitle">
          <div class="human-work-eyebrow" data-i18n="attention">Portfolio</div>
          <div id="humanWorkTitle" class="human-work-title" data-i18n="humanWorkTitle">At a glance</div>
          <a class="human-work-primary" href="#/watchlist" data-route="watchlist" title="Contracts whose latest monthly revenue fell below their trailing average">
            <span>
              <strong id="watchlist-count">0</strong>
              <span data-i18n="watchlistNeedsReview">contracts need review</span>
            </span>
          </a>
          <div class="human-work-secondary">
            <a href="#/contracts?filter=at_risk" data-route="contracts" title="Contracts lagging their expected repayment pace, or delinquent">
              <strong id="count-atrisk">0</strong>
              <span data-i18n="atRisk">at risk</span>
            </a>
            <a href="#/contracts" data-route="contracts" title="Every contract in the book">
              <strong id="count-contracts">0</strong>
              <span data-i18n="contracts">contracts</span>
            </a>
          </div>
        </section>
        <div class="sidebar-separator"></div>
        <nav class="filters" aria-label="Main">
          <a href="#/overview" data-route="overview" data-i18n="overview">Overview</a>
          <a href="#/contracts" data-route="contracts" data-i18n="contractsTitle">Contracts</a>
          <a href="#/concentration" data-route="concentration" data-i18n="concentrationTitle">Concentration</a>
          <a href="#/watchlist" data-route="watchlist" data-i18n="watchlistTitle">Watchlist</a>
          <a href="#/settings" data-route="settings" data-i18n="settings">Help & Settings</a>
        </nav>
        <div class="sidebar-footer">
          <label for="language" data-i18n="language">Language</label>
          <select id="language">
            <option value="auto">Auto</option>
            <option value="en">English</option>
            <option value="zh">中文</option>
          </select>
        </div>
      </aside>
      <main class="main">
        <div class="mobile-topbar">
          <button id="mobileSidebarToggle" class="mobile-sidebar-toggle" type="button" aria-controls="appSidebar" aria-label="Open sidebar" title="Open sidebar"><span class="sidebar-toggle-icon" aria-hidden="true"></span></button>
          <div class="mobile-topbar-copy">
            <div id="mobileViewTitle" class="mobile-view-title">Portfolio Health</div>
            <div id="mobileViewMeta" class="mobile-view-meta">Loading</div>
          </div>
          <button id="mobileRefresh" class="mobile-refresh-button" type="button" title="Refresh" aria-label="Refresh">↻</button>
        </div>
        <div id="loadState" class="load-state" role="status">Loading</div>
        <!-- Overview is the only page with a hero and a metrics band. -->
        <section id="overviewPage" class="ws-overview" hidden>
          <header class="page-hero">
            <div>
              <h1 id="overviewTitle">Overview</h1>
              <p id="overviewSummary"></p>
            </div>
            <div class="page-actions">
              <button id="refresh" class="button" type="button" title="Refresh">Refresh</button>
            </div>
          </header>
          <div id="overviewMetrics" class="ws-metrics" aria-label="Portfolio summary"></div>
          <div id="overviewBody"></div>
        </section>
        <!-- Record views: one toolbar row over a full-bleed table. -->
        <section id="viewPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title">
              <h1 id="viewTitle"></h1>
              <span id="viewCount" class="ws-count"></span>
            </div>
            <div class="ws-actions">
              <div id="viewFilters" class="segmented" role="group" hidden></div>
              <label class="search toolbar-search">
                <span class="sr-only" data-i18n="search">Search</span>
                <input id="search" type="search" autocomplete="off" placeholder="Search">
              </label>
            </div>
          </header>
          <div id="workspace" class="ws-workspace">
            <div id="listPanel" class="ws-list"></div>
            <aside id="detailPanel" class="ws-detail" aria-live="polite">
              <div class="ws-detail-bar">
                <button id="detailBack" class="button" type="button">Back to list</button>
                <a id="detailExpand" class="button" hidden>Open full page</a>
              </div>
              <div id="detailBody"></div>
            </aside>
          </div>
        </section>
        <section id="settingsPage" class="ws-view" hidden>
          <header class="ws-toolbar">
            <div class="ws-title"><h1 id="settingsTitle">Help &amp; Settings</h1></div>
          </header>
          <div id="settingsContent" class="settings-scroll"><div id="settingsInfo" class="settings"></div></div>
        </section>
      </main>
    </div>
    <div id="sidebarScrim" class="sidebar-scrim" hidden></div>
    <script type="module" src="./app.js"></script>
    <script type="module" src="./accent-theme.js"></script>
  </body>
</html>
